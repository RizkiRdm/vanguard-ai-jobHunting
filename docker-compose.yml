# The database, auth and storage are hosted by Supabase, so only the two Node
# processes run here. Provide the same .env to both.
services:
  api:
    build: .
    env_file: .env
    ports:
      - '8000:8000'
    command: ['npx', 'tsx', 'apps/server/src/api.ts']

  worker:
    build: .
    env_file: .env
    # Browser contexts keep per-user state here; mount a volume in production.
    volumes:
      - browser-state:/app/.browser-state
    command: ['npx', 'tsx', 'apps/server/src/worker.ts']

volumes:
  browser-state:
